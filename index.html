<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEasy – Experiment 2 | Adaptive &amp; Responsive UI</title>
  <meta name="description" content="Flutter Lab Experiment 2: ShopEasy product catalog showing LayoutBuilder-style responsive columns (2 / 3 / 4)." />
  <style>
    :root {
      --bg: #14102B; --surface: #221B44; --accent: #2EC4B6;
      --gold: #FFBF69; --soft: #ADA6CF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 15% 0%, #2d2466, #0c0a1c 70%);
      color: #fff; min-height: 100vh; padding: 24px 16px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }

    /* Device switcher */
    .switcher { display: flex; gap: 8px; }
    .switcher button {
      background: var(--surface); color: #fff; border: 1px solid transparent;
      border-radius: 20px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .switcher button.on { background: var(--accent); color: var(--bg); }

    /* Device frame – width drives the column count, like LayoutBuilder */
    .device {
      width: 390px; max-width: 100%; height: 780px;
      background: var(--bg); border: 8px solid #07050f; border-radius: 32px;
      display: flex; flex-direction: column; overflow: hidden;
      transition: width .3s ease;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }
    .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 8px; flex-shrink: 0; }
    .brand { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: .5px; }
    .cart-chip {
      background: var(--surface); border: 1px solid rgba(46,196,182,.6);
      border-radius: 20px; padding: 6px 12px; font-weight: 700; font-size: 14px;
    }
    .hero {
      margin: 4px 12px 10px; padding: 16px; border-radius: 20px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #5E60CE);
      display: flex; align-items: center; gap: 10px;
    }
    .hero-text { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .eyebrow { font-size: 11px; letter-spacing: 2px; font-weight: 600; color: rgba(255,255,255,.75); }
    .hero h1 { font-size: 18px; font-weight: 800; }
    .hero p { font-size: 12px; color: rgba(255,255,255,.8); }
    .hero .emoji { font-size: 44px; }

    .search { margin: 0 12px; flex-shrink: 0; }
    .search input {
      width: 100%; background: var(--surface); border: none; border-radius: 14px;
      padding: 12px 14px; color: #fff; font-size: 14px; outline: none;
    }
    .search input:focus { box-shadow: 0 0 0 2px var(--accent); }
    .chips { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    .chip {
      background: var(--surface); border-radius: 20px; padding: 7px 14px;
      font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; user-select: none;
    }
    .chip.on { background: var(--accent); color: var(--bg); }

    .grid {
      flex: 1; overflow-y: auto; padding: 0 12px 12px;
      display: grid; gap: 12px; align-content: start;
      scrollbar-width: thin; scrollbar-color: #4a3d78 transparent;
    }
    .card { background: var(--surface); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform .18s; }
    .card:hover { transform: translateY(-3px); }
    .thumb { height: 96px; display: flex; align-items: center; justify-content: center; font-size: 46px; background: color-mix(in srgb, var(--tint) 18%, transparent); }
    .body { padding: 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat { font-size: 11px; font-weight: 600; color: var(--tint); }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
    .price { font-weight: 800; font-size: 13px; color: var(--gold); }
    .rating { font-size: 11px; color: var(--soft); }
    .rating b { color: var(--gold); }
    .add {
      margin-top: auto; border: none; border-radius: 10px; padding: 8px 0; cursor: pointer;
      background: var(--accent); color: var(--bg); font-weight: 700; font-size: 12px;
    }
    .add:active { transform: scale(.96); }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--soft); padding: 30px; font-size: 13px; }
  </style>
</head>
<body>

  <div class="switcher" id="switcher">
    <button data-w="390" class="on">📱 Mobile</button>
    <button data-w="700">📟 Tablet</button>
    <button data-w="1000">🖥️ Desktop</button>
  </div>

  <div class="device" id="device">
    <div class="app-bar">
      <div class="brand">ShopEasy</div>
      <div class="cart-chip">🛒 <span id="cartCount">0</span></div>
    </div>

    <div class="hero">
      <div class="hero-text">
        <span class="eyebrow">EXPERIMENT 2</span>
        <h1>Adaptive &amp; Responsive UI</h1>
        <p id="layoutInfo"></p>
      </div>
      <div class="emoji">📐</div>
    </div>

    <div class="search"><input id="search" placeholder="Search products..." /></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>

<script>
  const products = [
    { name: 'Laptop',      cat: 'Electronics', price: 54999, rating: 4.5, icon: '💻', tint: '#4CC9F0' },
    { name: 'Smartphone',  cat: 'Electronics', price: 29999, rating: 4.7, icon: '📱', tint: '#2EC4B6' },
    { name: 'Headphones',  cat: 'Electronics', price: 4499,  rating: 4.3, icon: '🎧', tint: '#B388EB' },
    { name: 'Smart Watch', cat: 'Accessories', price: 9999,  rating: 4.6, icon: '⌚', tint: '#FFBF69' },
    { name: 'Camera',      cat: 'Electronics', price: 39999, rating: 4.4, icon: '📷', tint: '#EF476F' },
    { name: 'Sneakers',    cat: 'Fashion',     price: 3999,  rating: 4.2, icon: '👟', tint: '#06D6A0' },
    { name: 'Backpack',    cat: 'Fashion',     price: 2499,  rating: 4.1, icon: '🎒', tint: '#FF5D8F' },
    { name: 'Tablet',      cat: 'Electronics', price: 24999, rating: 4.5, icon: '📟', tint: '#7B8CDE' },
  ];
  const categories = ['All', 'Electronics', 'Fashion', 'Accessories'];
  let category = 'All', query = '', cart = 0;

  const $ = id => document.getElementById(id);
  const inr = n => '₹ ' + n.toLocaleString('en-IN');

  // Same rule as the Dart LayoutBuilder: <600 -> 2, 600-899 -> 3, >=900 -> 4
  function columnsFor(w) { return w >= 900 ? 4 : w >= 600 ? 3 : 2; }
  function deviceFor(w) { return w >= 900 ? 'Desktop' : w >= 600 ? 'Tablet' : 'Mobile'; }

  function layout() {
    const w = Math.round($('device').getBoundingClientRect().width - 16); // minus border
    const cols = columnsFor(w);
    $('grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    $('layoutInfo').textContent = `${deviceFor(w)} · ${w}px · ${cols} columns`;
  }

  function render() {
    const items = products.filter(p =>
      (category === 'All' || p.cat === category) &&
      p.name.toLowerCase().includes(query.toLowerCase()));
    $('grid').innerHTML = items.length ? items.map((p, i) => `
      <div class="card" style="--tint:${p.tint}">
        <div class="thumb">${p.icon}</div>
        <div class="body">
          <div class="name">${p.name}</div>
          <div class="cat">${p.cat}</div>
          <div class="row"><span class="price">${inr(p.price)}</span>
            <span class="rating"><b>★</b> ${p.rating}</span></div>
          <button class="add" data-i="${i}">＋ Add</button>
        </div>
      </div>`).join('') : '<div class="empty">No products found</div>';
    $('grid').querySelectorAll('.add').forEach(b => b.onclick = () => {
      $('cartCount').textContent = ++cart;
      b.textContent = '✓ Added';
      setTimeout(() => b.textContent = '＋ Add', 900);
    });
  }

  $('chips').innerHTML = categories.map(c => `<div class="chip${c === 'All' ? ' on' : ''}">${c}</div>`).join('');
  $('chips').onclick = e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on'); category = chip.textContent; render();
  };
  $('search').oninput = e => { query = e.target.value; render(); };

  $('switcher').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#switcher button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    $('device').style.width = b.dataset.w + 'px';
    setTimeout(layout, 320);
  };

  window.addEventListener('resize', layout);
  render(); layout();
</script>
</body>
</html>
